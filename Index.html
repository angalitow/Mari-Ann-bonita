<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Para Mi Bonita 💖</title>
  <style>
    body {
      margin: 0;
      font-family: 'Cursive', sans-serif;
      background: linear-gradient(135deg, #a18cd1, #fbc2eb); /* tonos morados y rosados */
      background-repeat: no-repeat;
      background-attachment: fixed;
      background-size: cover;
      color: #fff;
      text-align: center;
      overflow-x: hidden;
    }

    h1 {
      margin-top: 5vh;
      font-size: clamp(2em, 6vw, 3.5em);
      text-shadow: 2px 2px 6px rgba(0,0,0,0.3);
      animation: fadeIn 3s ease-in-out;
      padding: 0 10px;
    }

    .mensaje {
      font-size: clamp(1em, 4vw, 1.5em);
      margin: 20px auto;
      max-width: 90%;
      padding: 15px;
      border-radius: 15px;
      background: rgba(255,255,255,0.2);
      backdrop-filter: blur(5px);
      animation: aparecer 2s ease-in-out;
      word-wrap: break-word;
    }

    .boton {
      margin-top: 30px;
      padding: 12px 25px;
      font-size: clamp(1em, 4vw, 1.2em);
      border: none;
      border-radius: 25px;
      background: #ff6f91;
      color: #fff;
      cursor: pointer;
      transition: transform 0.3s, background 0.3s;
    }

    .boton:hover {
      transform: scale(1.1);
      background: #ff3c6a;
    }

    @keyframes fadeIn {
      from {opacity: 0;}
      to {opacity: 1;}
    }

    @keyframes aparecer {
      from {opacity: 0; transform: translateY(20px);}
      to {opacity: 1; transform: translateY(0);}
    }

    .corazon {
      position: absolute;
      font-size: clamp(1.5em, 5vw, 2.5em);
      color: #ff3c6a;
      animation: flotar 6s linear infinite;
    }

    @keyframes flotar {
      0% {transform: translateY(0) rotate(0);}
      100% {transform: translateY(-800px) rotate(360deg);}
    }
  </style>
</head>
<body>
  <h1>Para Mi Bonita 💕</h1>
  <div id="contenedorMensajes"></div>
  <button class="boton" onclick="mostrarMensaje()">💌 Mensaje para ti</button>

  <script>
    const mensajes = [
      "Eres mi razón de sonreír cada día 🌸",
      "Tu mirada ilumina mi mundo ✨",
      "Cada momento contigo es un regalo 🎁",
      "Te adoro más de lo que las palabras pueden decir 💖",
      "Eres mi inspiración y mi paz 🌹",
      "Contigo todo es más bonito 🌈",
      "Tu voz es mi melodía favorita 🎶",
      "Eres mi refugio en la tormenta ⛅",
      "Tu sonrisa es mi amanecer ☀️",
      "Eres mi destino y mi camino 🚀",
      "Cada abrazo tuyo es un hogar 🏡",
      "Eres mi mejor aventura 🌍",
      "Tu querer me hace invencible 🛡️",
      "Eres mi sueño hecho realidad 🌙",
      "Tu ternura me desarma 💕",
      "Eres mi estrella en la noche ⭐",
      "Tu risa es mi medicina 💊",
      "Eres mi milagro cotidiano ✨",
      "Tu presencia es mi regalo 🎁",
      "Eres mi poema favorito 📖",
      "Tu cariño me da alas 🕊️",
      "Eres mi razón de luchar ⚔️",
      "Tu dulzura me envuelve 🍯",
      "Eres mi secreto más hermoso 🔐",
      "Tu mirada me hipnotiza 👀",
      "Eres mi paz en el caos 🌀",
      "Tu luz me completa y me guía 🧩",
      "Eres mi canción eterna, el soundtrack de mi vida 🎵",
      "Tu cariño me fortalece 💪",
      "Eres mi luz en la oscuridad 🔦",
      "Tu querer es mi tesoro 💎",
      "Eres mi mejor historia 📚",
      "Tu sonrisa me salva 💫",
      "Eres mi universo 🌌",
      "Tu esencia me guía 🧭",
      "Eres mi alegría infinita 😍",
      "Tu ternura me inspira 🎨",
      "Eres mi razón de existir 🌱",
      "Tu calor me da esperanza 🌟",
      "Eres mi destino escrito ✍️",
      "Tu abrazo es mi paz 🫂",
      "Eres mi mejor casualidad 🍀",
      "Este amor me hace libre 🦋",
      "Eres mi sol radiante 🌞",
      "Tu presencia me calma 🌊",
      "Eres mi mejor regalo 🎀",
      "Tu cariño me hace soñar 💭",
      "Eres mi razón de creer 🙏",
      "Tu sonrisa ilumina mi alma 🔥",
      "Eres mi todo 💝",
      "Verte es un placer infinito ♾️",
      "Eres mi siempre 💍",
      "Tu ternura me enamora 💓",
      "Eres mi mejor futuro ⏳",
      "Tu querer me da vida 🌹",
      "Eres mi razón de amar ❤️"
    ];

    let indice = 0;

    function mostrarMensaje() {
      const contenedor = document.getElementById("contenedorMensajes");
      const mensaje = document.createElement("div");
      mensaje.className = "mensaje";
      mensaje.textContent = mensajes[indice];
      contenedor.appendChild(mensaje);

      indice++;
      if (indice >= mensajes.length) {
        indice = 0;
      }

      const corazon = document.createElement("div");
      corazon.className = "corazon";
      corazon.textContent = "❤";
      corazon.style.left = Math.random() * window.innerWidth + "px";
      corazon.style.top = window.innerHeight + "px";
      document.body.appendChild(corazon);

      setTimeout(() => {
        corazon.remove();
      }, 6000);
    }
  </script>
</body>
</html>
